services:
  bot:
    build: .
    image: tg-userbot:local
    container_name: tg-userbot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    networks:
      - supabase
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8083/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  supabase:
    external: true
    name: supabase_default
