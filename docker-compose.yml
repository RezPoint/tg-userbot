services:
  bot:
    build: .
    image: tg-userbot:local
    container_name: tg-userbot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    networks:
      - supabase
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  supabase:
    external: true
    name: supabase_default
